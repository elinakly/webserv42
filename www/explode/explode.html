<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>302 Redirect</title>
    <link rel="stylesheet" href="../css/style.css">
    
    <!-- Redirect after 2 seconds -->
    <meta http-equiv="refresh" content="2;url=./images/explode_cat.gif">
</head>

<body class="error-page">

    <div class="background-glow glow-purple"></div>
    <div class="background-glow glow-blue"></div>

    <div class="error-container">

        <div class="error-code">302</div>

        <h1>REDIRECTED</h1>

        <p>
            The server cat launched your request somewhere else 🚀🐈<br>
            Redirecting to chaos...
        </p>

        <img src="./images/explode.png" alt="redirect cat">

        <p class="small-text">
            If nothing happens, prepare for explosion 💥
        </p>

    </div>

</body>
</html>
